<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧医疗就诊系统 - 统一登录</title>
<style>
:root{
  --brand:#0e8a8f; --brand-dark:#0b6e73; --brand-light:#e6f6f7;
  --ink:#16323c; --muted:#6b7f8a; --line:#dce9ec;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{min-height:100vh;display:flex;background:#f2f7f8}
/* 左侧品牌区 */
.brand{flex:1.1;background:linear-gradient(160deg,#0b6e73 0%,#0e8a8f 55%,#14b8a6 100%);color:#fff;display:flex;flex-direction:column;justify-content:center;padding:60px 64px;position:relative;overflow:hidden}
.brand::before{content:"";position:absolute;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.08);top:-140px;right:-120px}
.brand::after{content:"";position:absolute;width:280px;height:280px;border-radius:50%;background:rgba(255,255,255,.06);bottom:-90px;left:-70px}
.brand .cross{font-size:2.6rem;margin-bottom:18px}
.brand h1{font-size:2rem;letter-spacing:2px;margin-bottom:14px;position:relative}
.brand p{opacity:.92;line-height:2;font-size:.98rem;max-width:440px;position:relative}
.brand .flow{margin-top:34px;display:flex;flex-wrap:wrap;gap:10px;position:relative}
.brand .flow span{background:rgba(255,255,255,.16);backdrop-filter:blur(4px);padding:7px 14px;border-radius:999px;font-size:.8rem}
/* 右侧表单区 */
.panel{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
.login-card{width:430px;max-width:100%;background:#fff;border-radius:20px;box-shadow:0 20px 60px rgba(11,110,115,.14);padding:38px 40px;animation:up .45s ease}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.login-card h2{font-size:1.3rem;color:var(--ink);margin-bottom:4px}
.login-card .sub{color:var(--muted);font-size:.82rem;margin-bottom:22px}
.role-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.role-tabs button{border:2px solid var(--line);background:#f8fbfc;border-radius:14px;padding:12px 4px;cursor:pointer;font-size:.84rem;color:#5b7280;transition:.22s;display:flex;flex-direction:column;align-items:center;gap:5px}
.role-tabs button .ico{font-size:1.45rem}
.role-tabs button:hover{border-color:#9fd4d8;transform:translateY(-2px)}
.role-tabs button.active{border-color:var(--brand);background:var(--brand-light);color:var(--brand-dark);font-weight:600;box-shadow:0 4px 12px rgba(14,138,143,.18)}
label{font-size:.85rem;color:#48606c;display:block;margin-bottom:6px;font-weight:500}
.field{position:relative;margin-bottom:16px}
.field .prefix{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:1rem;opacity:.55}
.field input{width:100%;padding:12px 14px 12px 40px;border:1.5px solid var(--line);border-radius:10px;font-size:.95rem;outline:none;transition:.2s;background:#fbfdfd}
.field input:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(14,138,143,.12);background:#fff}
.login-btn{width:100%;padding:13px;border:none;border-radius:10px;background:linear-gradient(90deg,var(--brand-dark),var(--brand));color:#fff;font-size:1.02rem;font-weight:600;letter-spacing:6px;cursor:pointer;transition:.22s;box-shadow:0 8px 18px rgba(14,138,143,.3)}
.login-btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(14,138,143,.38)}
.login-btn:active{transform:none}
.remember{display:flex;align-items:center;gap:7px;font-size:.85rem;color:#48606c;font-weight:500;margin:-4px 0 18px;cursor:pointer;user-select:none}
.remember input{width:16px;height:16px;margin:0;accent-color:var(--brand);cursor:pointer}
.demo{margin-top:18px;background:#f4f9fa;border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:.78rem;color:var(--muted);line-height:1.9}
.demo b{color:var(--brand-dark)}
.err{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 13px;font-size:.85rem;margin-bottom:14px;display:none;animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.links{text-align:center;margin-top:18px;font-size:.82rem}
.links a{color:var(--brand);text-decoration:none;font-weight:500}
.links a:hover{text-decoration:underline}
@media (max-width:860px){.brand{display:none}.panel{flex:1}}
</style>
</head>
<body>
<div class="brand">
  <div class="cross">⚕️</div>
  <h1>智慧医疗就诊系统</h1>
  <p>覆盖线上就诊全流程的一体化平台：预约挂号、AI预分诊、在线问诊、电子处方、线上缴费、药房发药，让就医更便捷。</p>
  <div class="flow">
    <span>📅 预约挂号</span><span>🤖 AI预分诊</span><span>💬 在线问诊</span>
    <span>📝 电子处方</span><span>💰 在线缴费</span><span>💊 药房发药</span>
  </div>
</div>

<div class="panel">
  <div class="login-card">
    <h2>欢迎登录</h2>
    <p class="sub">请选择您的身份类型，登录后进入对应的工作端</p>

    <div class="role-tabs" id="roleTabs">
      <button data-role="patient" class="active"><span class="ico">🧑‍🦱</span>患者</button>
      <button data-role="doctor"><span class="ico">🩺</span>医生</button>
      <button data-role="pharmacy"><span class="ico">💊</span>药房</button>
      <button data-role="admin"><span class="ico">🖥️</span>管理员</button>
    </div>

    <div class="err" id="errBox"></div>

    <!-- 登录表单 -->
    <div id="loginForm">
      <label id="accountLabel">手机号</label>
      <div class="field"><span class="prefix">📱</span><input id="account" placeholder="请输入手机号" autocomplete="off"></div>
      <label>密码</label>
      <div class="field"><span class="prefix">🔒</span><input id="password" type="password" placeholder="请输入密码"></div>
      <label class="remember"><input type="checkbox" id="remember">记住账号密码（7 天）</label>
      <button class="login-btn" onclick="doLogin()">登 录</button>
    </div>

    <!-- 注册表单（仅患者） -->
    <div id="registerForm" style="display:none">
      <label>手机号</label>
      <div class="field"><span class="prefix">📱</span><input id="regPhone" placeholder="请输入11位手机号" autocomplete="off"></div>
      <label>姓名</label>
      <div class="field"><span class="prefix">👤</span><input id="regName" placeholder="请输入真实姓名"></div>
      <label>设置密码</label>
      <div class="field"><span class="prefix">🔒</span><input id="regPwd" type="password" placeholder="请设置登录密码"></div>
      <label>确认密码</label>
      <div class="field"><span class="prefix">🔒</span><input id="regPwd2" type="password" placeholder="请再次输入密码"></div>
      <button class="login-btn" onclick="doRegister()">注 册</button>
    </div>

    <div class="links" id="regLinkBox" style="margin-top:14px">
      没有账号？<a href="javascript:toggleMode()">注册新账号 →</a>
    </div>

    <div class="demo" id="demoHint"><b>患者演示账号</b>：13800000001 / 123456（可在患者端注册新账号）</div>

    <div class="links"><a href="/">先逛逛患者端 →</a></div>
  </div>
</div>

<script>
const ROLE_META = {
  patient:  { label: '手机号',  ph: '请输入手机号',   hint: '<b>患者演示账号</b>：13800000001 / 123456（可在患者端注册新账号）' },
  doctor:   { label: '医生工号', ph: '请输入医生工号，如 D1001', hint: '<b>医生演示账号</b>：D1001（王建国·心血管内科）/ 123456，其他医生 D1002~D1010' },
  pharmacy: { label: '药房账号', ph: '请输入药房账号', hint: '<b>药房演示账号</b>：yf001 / 123456' },
  admin:    { label: '管理员账号', ph: '请输入管理员账号', hint: '<b>管理员演示账号</b>：admin / 123456' }
};
let role = 'patient';
let mode = 'login'; // login / register（注册仅患者身份）

//记住账号密码：按身份分槽（四个身份的账号形态不同：手机号/工号/药房号/admin），
//明文存 localStorage，7 天后自动作废。本项目服务端口令本就是明文，这个取舍用户已确认接受
const REMEMBER_MS = 7 * 24 * 60 * 60 * 1000;
function loadRemembered(r) {
  const raw = localStorage.getItem('remember_' + r);
  if (!raw) return null;
  try {
    const rec = JSON.parse(raw);
    if (rec && typeof rec.account === 'string' && typeof rec.password === 'string'
        && typeof rec.expireAt === 'number' && rec.expireAt > Date.now()) {
      return rec;
    }
  } catch (e) {
    //坏数据（手工改过 / 格式不兼容）当作没记住，别让登录页直接白屏
  }
  localStorage.removeItem('remember_' + r);
  return null;
}
function saveRemembered(r, account, password) {
  localStorage.setItem('remember_' + r,
    JSON.stringify({ account: account, password: password, expireAt: Date.now() + REMEMBER_MS }));
}
const qs = new URLSearchParams(location.search);
if (qs.get('role') && ROLE_META[qs.get('role')]) role = qs.get('role');

function renderRole() {
  document.querySelectorAll('#roleTabs button').forEach(b => b.classList.toggle('active', b.dataset.role === role));
  document.getElementById('accountLabel').textContent = ROLE_META[role].label;
  document.getElementById('account').placeholder = ROLE_META[role].ph;
  document.getElementById('demoHint').innerHTML = ROLE_META[role].hint;
  document.getElementById('errBox').style.display = 'none';
  //注册入口只对患者身份开放
  document.getElementById('regLinkBox').style.display = role === 'patient' ? 'block' : 'none';
  if (role !== 'patient' && mode === 'register') toggleMode();
  //带出该身份上次记住的账号密码；切页签也走这里，所以四个身份的记录互不干扰
  const rec = loadRemembered(role);
  document.getElementById('account').value = rec ? rec.account : '';
  document.getElementById('password').value = rec ? rec.password : '';
  document.getElementById('remember').checked = !!rec;
}
document.getElementById('roleTabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  role = btn.dataset.role;
  renderRole();
});
renderRole();

//登录/注册模式切换（仅患者身份）
function toggleMode() {
  mode = mode === 'login' ? 'register' : 'login';
  document.getElementById('loginForm').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('registerForm').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('regLinkBox').innerHTML = mode === 'login'
    ? '没有账号？<a href="javascript:toggleMode()">注册新账号 →</a>'
    : '已有账号？<a href="javascript:toggleMode()">去登录 →</a>';
  document.querySelector('.login-card h2').textContent = mode === 'login' ? '欢迎登录' : '患者注册';
  document.querySelector('.login-card .sub').textContent = mode === 'login'
    ? '请选择您的身份类型，登录后进入对应的工作端'
    : '首次就诊请先注册患者账号，注册成功后即可登录';
  document.getElementById('errBox').style.display = 'none';
}

function showErr(msg) {
  const box = document.getElementById('errBox');
  box.textContent = msg;
  box.style.display = 'block';
}

async function doLogin() {
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value;
  if (!account || !password) { showErr('请输入账号和密码'); return; }
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: new URLSearchParams({ role, account, password })
    });
    const r = await res.json();
    if (r.code !== 200) {
      //患者登录时账号不存在（从未注册过）→ 引导跳转注册
      if (role === 'patient' && r.code === 404) {
        const box = document.getElementById('errBox');
        box.innerHTML = '该手机号还未注册过账号。<a href="javascript:goRegisterWithPhone()" style="color:#0e8a8f;font-weight:600">点击这里注册账号 →</a>';
        box.style.display = 'block';
        return;
      }
      showErr(r.msg);
      return;
    }
    const data = r.data;
    //按角色分开存（token_患者 / token_医生 / ...）：四个端共用同一个 localStorage，
    //只存一份的话，登录医生端就会把患者端的登录态覆盖掉，切回来就变成"未登录"
    localStorage.setItem('token_' + data.role, data.token);
    localStorage.setItem('user_' + data.role, JSON.stringify(data.profile));
    //清掉旧版本遗留的 key，避免页面读到过期身份
    ['token', 'user', 'role', 'patient', 'doctor', 'doctor_token', 'staff'].forEach(k => localStorage.removeItem(k));
    //记住账号密码：勾了才记，且只记这一次登录的身份；没勾要把上次的记录清掉
    if (document.getElementById('remember').checked) saveRemembered(role, account, password);
    else localStorage.removeItem('remember_' + role);
    location.href = data.home;
  } catch (e) {
    showErr('网络异常：' + e.message);
  }
}

//未注册账号 → 带着手机号跳转到注册界面
function goRegisterWithPhone() {
  const phone = document.getElementById('account').value.trim();
  toggleMode();
  if (phone) document.getElementById('regPhone').value = phone;
  document.getElementById('regName').focus();
}

//患者注册
async function doRegister() {
  const phone = document.getElementById('regPhone').value.trim();
  const name = document.getElementById('regName').value.trim();
  const pwd = document.getElementById('regPwd').value;
  const pwd2 = document.getElementById('regPwd2').value;
  if (!/^1\d{10}$/.test(phone)) { showErr('请输入正确的11位手机号'); return; }
  if (!name) { showErr('请输入真实姓名（挂号就诊需要实名信息）'); return; }
  if (!pwd || pwd.length < 6) { showErr('密码至少6位'); return; }
  if (pwd !== pwd2) { showErr('两次输入的密码不一致'); return; }
  try {
    const res = await fetch('/api/patient/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password: pwd, name })
    });
    const r = await res.json();
    if (r.code !== 200) { showErr(r.msg); return; }
    alert('注册成功！请使用手机号和密码登录');
    //注册成功切回登录模式并预填手机号
    toggleMode();
    document.getElementById('account').value = phone;
    document.getElementById('password').focus();
  } catch (e) {
    showErr('网络异常：' + e.message);
  }
}
document.addEventListener('keydown', e => { if (e.key === 'Enter') mode === 'login' ? doLogin() : doRegister(); });
</script>
</body>
</html>
