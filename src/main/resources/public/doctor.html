<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧医疗就诊系统 - 医生端</title>
<link rel="stylesheet" href="/css/app.css">
<style>
/* 本页独占：头部医生卡片 + 折叠子面板 + 处方数量框 + 消息时间戳 */
.doc-flex{display:flex;gap:var(--sp-4);align-items:center}
.doc-body{display:flex;flex-direction:column;gap:var(--sp-1);min-width:0}
.doc-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap}
.doc-name{font-size:var(--fs-lg)}
.subpanel{display:none;margin-top:var(--sp-3);border-top:1px dashed var(--line);padding-top:var(--sp-3)}
.qty{max-width:90px}
.msg-time{font-size:var(--fs-xs);opacity:.7}
</style>
</head>
<body data-role="doctor">
<div class="topbar">
  <div class="logo"><i data-lucide="heart-pulse" class="ico"></i>智慧医疗就诊系统 <span class="badge">医生端工作台</span></div>
  <div id="staffArea"></div>
</div>

<div class="main">
  <div class="card">
    <h3><i data-lucide="stethoscope" class="ico"></i>当前医生</h3>
    <div id="doctorCard"></div>
  </div>

  <div class="card">
    <h3><i data-lucide="bell" class="ico"></i>接诊提醒（待接诊）</h3>
    <div id="pendingList"></div>
  </div>

  <div class="card">
    <h3><i data-lucide="calendar-days" class="ico"></i>挂号患者队列（已缴费 · 待就诊）</h3>
    <button class="btn btn--neutral sm" onclick="loadRegQueue()">刷新</button>
    <div id="regQueueList"></div>
    <div id="visitPanel" class="subpanel">
      <div id="visitWho" class="muted" style="margin-bottom:var(--sp-2)"></div>
      <label>诊断结论</label>
      <input id="visitDiagnosis" placeholder="如：急性支气管炎">
      <label>医嘱建议（可选）</label>
      <textarea id="visitAdvice" rows="2" placeholder="如：按时服药，多饮水，一周后复诊"></textarea>
      <button class="btn sm" onclick="doFinishVisit()">确认完成就诊</button>
      <button class="btn btn--neutral sm" onclick="document.getElementById('visitPanel').style.display='none'">取消</button>
    </div>
  </div>

  <div class="card">
    <h3><i data-lucide="message-square" class="ico"></i>我的问诊</h3>
    <div id="consultList"></div>
  </div>

  <div class="card" id="chatCard" style="display:none">
    <h3><i data-lucide="message-square" class="ico"></i>问诊对话 <span id="chatMeta"></span></h3>
    <div id="chatPatient" class="muted" style="margin-bottom:var(--sp-2)"></div>
    <div class="chat-box" id="chatBox"></div>
    <div class="row" style="margin-top:var(--sp-3)">
      <input id="chatInput" placeholder="回复患者..." style="margin-bottom:0">
      <button class="btn shrink" onclick="sendMsg()">发送</button>
    </div>
    <div style="margin-top:var(--sp-3);display:flex;gap:var(--sp-3);flex-wrap:wrap">
      <button class="btn btn--neutral sm" onclick="refreshMsgs()">刷新消息</button>
      <button class="btn btn--info sm" onclick="showHistory()">查看患者病历</button>
      <button class="btn sm" onclick="openRxForm()">开具电子处方</button>
      <button class="btn btn--warn sm" onclick="finishConsult()">结束问诊</button>
    </div>
    <div id="finishPanel" class="subpanel">
      <label>问诊小结（诊疗意见、生活与用药建议）</label>
      <textarea id="finishSummary" rows="2" placeholder="如：支气管炎急性发作，按时服药，多喝水，三天后复诊"></textarea>
      <button class="btn btn--warn sm" onclick="doFinishConsult()">确认结束问诊</button>
      <button class="btn btn--neutral sm" onclick="document.getElementById('finishPanel').style.display='none'">取消</button>
    </div>
  </div>

  <div class="card" id="rxCard" style="display:none">
    <h3><i data-lucide="file-text" class="ico"></i>开具电子处方</h3>
    <label>诊断结论</label>
    <input id="rxDiagnosis" placeholder="如：急性上呼吸道感染">
    <label>选择药品（从药品字典检索，自动校验库存）</label>
    <div class="row">
      <select id="rxMedicine"></select>
      <input id="rxQty" class="qty" type="number" placeholder="数量" value="1">
      <input id="rxDosage" placeholder="单次剂量 如:1粒">
      <input id="rxFrequency" placeholder="频次 如:每日3次">
      <input id="rxCourse" placeholder="疗程 如:3天">
      <button class="btn shrink sm" onclick="addRxItem()">加入处方</button>
    </div>
    <div id="rxItems"></div>
    <button class="btn" onclick="submitRx()">提交处方（校验后流转药房）</button>
    <div id="rxResult"></div>
  </div>

  <div class="card" id="historyCard" style="display:none">
    <h3><i data-lucide="history" class="ico"></i>患者病历与历史记录</h3>
    <div id="historyList"></div>
  </div>

  <div class="card">
    <h3><i data-lucide="clipboard-list" class="ico"></i>我的处方历史</h3>
    <button class="btn btn--neutral sm" onclick="loadMyRx()">刷新</button>
    <div id="rxList"></div>
  </div>
</div>
<footer>智慧医疗就诊系统 · 医生端 | 在线接诊 · 在线问诊 · 电子处方</footer>

<script src="/js/lucide.min.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/app.js"></script>
<script>
//统一登录：令牌与身份按角色分槽存（token_患者 / token_医生 ...），四个端互不覆盖
//401 的四个开关（弹窗/抛异常/吞网络异常/跳转目标）医生端全是默认值，只改跳转目标要带角色
const S = SM.createSession({ role: 'doctor', redirect: '/login.html?role=doctor' });

//内联 onclick 里是 javascript:logoutDoctor()，靠 window 解析，必须保留这个全局函数
function logoutDoctor() { S.logout(); }

let doctor = null;
let currentConsult = null;
let currentReg = null;
let rxItems = [];
let medicines = [];

async function init() {
  //医生身份锁定为当前登录账号，不可切换到其他医生
  doctor = { id: S.user.id, name: S.user.name };
  document.getElementById('doctorCard').innerHTML = `
    <div class="doc-flex">
      <div class="avatar">${S.user.name[0]}</div>
      <div class="doc-body">
        <div class="doc-head">
          <b class="doc-name">${S.user.name}</b>
          ${SM.tag(S.user.title || '', 'success')}
          ${SM.tag(S.user.deptName || '', 'info')}
        </div>
        <div class="muted">工号 ${S.user.account} ｜ 挂号费 ￥${S.user.fee ?? '-'} ｜ 当前状态：${S.user.onlineStatus || '在线'}</div>
        <div class="muted">擅长：${S.user.specialty || '常见病诊治'}</div>
      </div>
    </div>`;
  const mr = await S.api('/api/doctorwork/medicines');
  medicines = mr.data || [];
  document.getElementById('rxMedicine').innerHTML = medicines.map(m =>
    `<option value="${m.id}">${m.name} ${m.spec}（￥${m.price} 库存${m.stock}）</option>`).join('');
  loadPending(); loadConsults(); loadMyRx(); loadRegQueue();
}

// ==================== 挂号患者队列（门诊） ====================
async function loadRegQueue() {
  const r = await S.api('/api/doctorwork/reg/queue');
  const box = document.getElementById('regQueueList');
  if (!r.data || r.data.length === 0) { box.innerHTML = SM.empty('暂无已缴费待就诊的挂号'); return; }
  box.innerHTML = '<table><tr><th>挂号单号</th><th>就诊人</th><th>就诊日期</th><th>时段</th><th>挂号费</th><th>缴费时间</th><th>操作</th></tr>' +
    r.data.map(g => `<tr><td>${g.regNo}</td><td>${g.visitorName}</td><td>${SM.fmtDate(g.workDate)}</td>
      <td>${g.timeSlot}</td><td>￥${g.fee}</td><td>${SM.fmtTime(g.payTime)}</td>
      <td><button class="btn sm" onclick="openVisit(${g.id}, '${g.visitorName}')">完成就诊</button></td></tr>`).join('') + '</table>';
}
function openVisit(id, name) {
  currentReg = { id, name };
  document.getElementById('visitWho').textContent = `正在为【${name}】填写门诊病历`;
  document.getElementById('visitPanel').style.display = 'block';
  document.getElementById('visitDiagnosis').focus();
}
async function doFinishVisit() {
  if (!currentReg) return;
  const diagnosis = document.getElementById('visitDiagnosis').value.trim();
  const advice = document.getElementById('visitAdvice').value.trim();
  if (!diagnosis) { alert('请填写诊断结论'); return; }
  const r = await S.api(`/api/doctorwork/visit/finish?registrationId=${currentReg.id}&diagnosis=${encodeURIComponent(diagnosis)}&advice=${encodeURIComponent(advice)}`, { method: 'POST' });
  alert(r.msg);
  if (r.code === 200) {
    document.getElementById('visitPanel').style.display = 'none';
    document.getElementById('visitDiagnosis').value = '';
    document.getElementById('visitAdvice').value = '';
    currentReg = null;
  }
  loadRegQueue();
}

async function loadPending() {
  const r = await S.api('/api/doctorwork/pending');
  const box = document.getElementById('pendingList');
  if (!r.data || r.data.length === 0) { box.innerHTML = SM.empty('暂无待接诊的咨询'); return; }
  box.innerHTML = '<table><tr><th>编号</th><th>就诊人</th><th>类型</th><th>病情描述</th><th>发起时间</th><th>操作</th></tr>' +
    r.data.map(c => `<tr><td>${c.id}</td><td>${c.visitorName}</td><td>${c.type}</td>
      <td>${(c.description || '').substring(0, 25)}</td><td>${SM.fmtTime(c.createTime)}</td>
      <td><button class="btn sm" onclick="accept(${c.id})">接诊</button></td></tr>`).join('') + '</table>';
}
async function accept(id) {
  const r = await S.api('/api/doctorwork/accept?consultationId=' + id, { method: 'POST' });
  alert(r.msg);
  loadPending(); loadConsults();
  if (r.code === 200) openChat(id);
}

async function loadConsults() {
  const r = await S.api('/api/doctorwork/consultations');
  const box = document.getElementById('consultList');
  if (!r.data || r.data.length === 0) { box.innerHTML = SM.empty('暂无问诊'); return; }
  box.innerHTML = '<table><tr><th>编号</th><th>就诊人</th><th>类型</th><th>病情描述</th><th>状态</th><th>问诊小结</th><th>操作</th></tr>' +
    r.data.map(c => `<tr><td>${c.id}</td><td>${c.visitorName}</td><td>${c.type}</td>
      <td>${(c.description || '').substring(0, 20)}</td>
      <td>${SM.statusTag('consult', c.status)}</td>
      <td>${c.summary ? c.summary.substring(0, 15) : '-'}</td>
      <td><button class="btn btn--info sm" onclick="openChat(${c.id})">打开</button></td></tr>`).join('') + '</table>';
}

async function openChat(id) {
  currentConsult = id;
  document.getElementById('chatCard').style.display = 'block';
  const d = await S.api('/api/consult/detail?id=' + id);
  if (d.data) {
    document.getElementById('chatMeta').innerHTML = SM.statusTag('consult', d.data.status);
    document.getElementById('chatPatient').textContent =
      `就诊人：${d.data.visitorName} ｜ 问诊类型：${d.data.type} ｜ 发起时间：${SM.fmtTime(d.data.createTime)}`;
  }
  refreshMsgs();
  document.getElementById('chatCard').scrollIntoView({ behavior: 'smooth' });
}
async function refreshMsgs() {
  if (!currentConsult) return;
  const r = await S.api('/api/doctorwork/messages?consultationId=' + currentConsult);
  const box = document.getElementById('chatBox');
  box.innerHTML = (r.data || []).map(m =>
    `<div class="msg${m.sender === 'doctor' ? ' msg--mine' : ''}">${m.content}<div class="muted msg-time">${m.sender === 'doctor' ? '我' : '患者'} ${SM.fmtTime(m.createTime)}</div></div>`).join('');
  box.scrollTop = box.scrollHeight;
}
async function sendMsg() {
  const content = document.getElementById('chatInput').value.trim();
  if (!content) return;
  await S.api('/api/doctorwork/send', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ consultationId: currentConsult, content }) });
  document.getElementById('chatInput').value = '';
  refreshMsgs();
}
function finishConsult() {
  if (!currentConsult) { alert('请先打开一个问诊'); return; }
  document.getElementById('finishPanel').style.display = 'block';
  document.getElementById('finishSummary').focus();
}
async function doFinishConsult() {
  const summary = document.getElementById('finishSummary').value.trim();
  if (!summary) { alert('请填写问诊小结'); return; }
  const r = await S.api(`/api/doctorwork/finish?consultationId=${currentConsult}&summary=${encodeURIComponent(summary)}`, { method: 'POST' });
  alert(r.msg);
  if (r.code === 200) {
    document.getElementById('finishPanel').style.display = 'none';
    document.getElementById('finishSummary').value = '';
  }
  loadConsults(); refreshMsgs();
}

async function showHistory() {
  const d = await S.api('/api/consult/detail?id=' + currentConsult);
  if (!d.data) return;
  const r = await S.api('/api/doctorwork/patient/history?visitorId=' + d.data.visitorId);
  const box = document.getElementById('historyList');
  document.getElementById('historyCard').style.display = 'block';
  if (!r.data || r.data.length === 0) { box.innerHTML = SM.empty('该患者暂无历史病历'); return; }
  box.innerHTML = '<table><tr><th>时间</th><th>科室/医生</th><th>诊断</th><th>医嘱建议</th></tr>' +
    r.data.map(m => `<tr><td>${SM.fmtTime(m.createTime)}</td><td>${m.deptName || ''}/${m.doctorName}</td>
      <td>${m.diagnosis}</td><td>${m.advice || ''}</td></tr>`).join('') + '</table>';
  document.getElementById('historyCard').scrollIntoView({ behavior: 'smooth' });
}

// ==================== 电子处方 ====================
function openRxForm() {
  if (!currentConsult) { alert('请先打开一个问诊'); return; }
  rxItems = [];
  renderRxItems();
  document.getElementById('rxCard').style.display = 'block';
  document.getElementById('rxCard').scrollIntoView({ behavior: 'smooth' });
}
function addRxItem() {
  const sel = document.getElementById('rxMedicine');
  const mid = Number(sel.value);
  const qty = Number(document.getElementById('rxQty').value);
  if (!qty || qty <= 0) { alert('请输入正确的数量'); return; }
  const m = medicines.find(x => x.id === mid);
  if (rxItems.some(x => x.medicineId === mid)) { alert('该药品已在处方中'); return; }
  rxItems.push({
    medicineId: mid, medicineName: m.name,
    quantity: qty,
    dosage: document.getElementById('rxDosage').value,
    frequency: document.getElementById('rxFrequency').value,
    course: document.getElementById('rxCourse').value
  });
  renderRxItems();
}
function removeRxItem(mid) {
  rxItems = rxItems.filter(x => x.medicineId !== mid);
  renderRxItems();
}
function renderRxItems() {
  const box = document.getElementById('rxItems');
  if (rxItems.length === 0) { box.innerHTML = SM.empty('尚未添加药品'); return; }
  box.innerHTML = '<table><tr><th>药品</th><th>数量</th><th>单次剂量</th><th>频次</th><th>疗程</th><th>操作</th></tr>' +
    rxItems.map(i => `<tr><td>${i.medicineName}</td><td>${i.quantity}</td><td>${i.dosage}</td>
      <td>${i.frequency}</td><td>${i.course}</td>
      <td><button class="btn btn--warn sm" onclick="removeRxItem(${i.medicineId})">移除</button></td></tr>`).join('') + '</table>';
}
async function submitRx() {
  const diagnosis = document.getElementById('rxDiagnosis').value.trim();
  if (!diagnosis) { alert('请填写诊断结论'); return; }
  if (rxItems.length === 0) { alert('请至少添加一种药品'); return; }
  const r = await S.api('/api/doctorwork/rx/create', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ consultationId: currentConsult, diagnosis, items: rxItems }) });
  if (r.code !== 200) { alert('处方校验未通过：' + r.msg); return; }
  alert('处方提交成功！处方编号：' + r.data.rxNo + '，合计金额￥' + r.data.totalAmount + '，已流转至药房，等待患者缴费。');
  document.getElementById('rxCard').style.display = 'none';
  loadMyRx();
}
async function loadMyRx() {
  const r = await S.api('/api/doctorwork/rx/my');
  const box = document.getElementById('rxList');
  if (!r.data || r.data.length === 0) { box.innerHTML = SM.empty('暂无处方'); return; }
  box.innerHTML = '<table><tr><th>处方编号</th><th>就诊人</th><th>诊断</th><th>药品数</th><th>金额</th><th>状态</th><th>药房备注</th><th>操作</th></tr>' +
    r.data.map(p => `<tr><td>${p.rxNo}</td><td>${p.visitorName}</td><td>${(p.diagnosis || '').substring(0, 12)}</td>
      <td>${(p.items || []).length}种</td><td>￥${p.totalAmount}</td>
      <td>${SM.statusTag('rx', p.status)}</td><td>${p.remark || '-'}</td>
      <td>${p.status === '待缴费' ? `<button class="btn btn--warn sm" onclick="cancelRx(${p.id})">作废</button>` : ''}</td></tr>`).join('') + '</table>';
}
async function cancelRx(id) {
  if (!confirm('确认作废该处方？')) return;
  const r = await S.api('/api/doctorwork/rx/cancel?rxId=' + id, { method: 'POST' });
  alert(r.msg);
  loadMyRx();
}

//未登录（无身份或无令牌）直接跳登录页；已登录才初始化，
//否则 init() 会拿 null 取属性抛 TypeError，页面表现为空白
if (S.hasAuth()) {
  SM.renderTopbar({
    elId: 'staffArea', user: S.user, icon: 'stethoscope',
    label: u => `${u.name}（${u.account}）`,
    logoutFn: 'logoutDoctor', logoutText: '退出登录'
  });
  init();
} else {
  location.href = '/login.html?role=doctor';
}

SM.initIcons();
</script>
</body>
</html>
