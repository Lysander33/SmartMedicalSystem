<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智慧医疗就诊系统 - 药房</title>
<style>
:root{--brand:#b45309;--brand-dark:#92400e;--brand-light:#fdf3e7;--ink:#3d2a14;--muted:#8a7a64;--line:#efe5d8;--bg:#faf7f2}
*{box-sizing:border-box;margin:0;padding:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
body{background:var(--bg);min-height:100vh;color:var(--ink)}
.topbar{background:rgba(146,64,14,.97);backdrop-filter:blur(8px);color:#fff;padding:0 28px;height:62px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;box-shadow:0 2px 14px rgba(146,64,14,.3)}
.topbar b{font-size:1.12rem;letter-spacing:1px}
.topbar a{color:#fdf3e7;text-decoration:none;margin-left:14px;font-size:.85rem;opacity:.92;transition:.2s}
.topbar a:hover{opacity:1;color:#fff}
.main{max-width:1100px;margin:26px auto;padding:0 16px}
.card{background:#fff;border-radius:16px;padding:24px 26px;margin-bottom:20px;box-shadow:0 4px 18px rgba(146,64,14,.07);border:1px solid #f5eee4;animation:fade .3s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card h3{font-size:1.06rem;color:var(--ink);margin-bottom:14px;display:flex;align-items:center;gap:9px}
.card h3::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--brand),#f59e0b)}
.btn{display:inline-block;padding:9px 20px;border:none;border-radius:10px;background:var(--brand);color:#fff;font-size:.88rem;cursor:pointer;transition:.22s;font-weight:500}
.btn:hover{background:var(--brand-dark);transform:translateY(-1px);box-shadow:0 6px 14px rgba(180,83,9,.28)}
.btn.green{background:#16a34a}.btn.green:hover{background:#15803d}
.btn.blue{background:#0369a1}.btn.blue:hover{background:#075985}
.btn.gray{background:#94a3b8}.btn.gray:hover{background:#64748b}
.btn.sm{padding:5px 13px;font-size:.8rem;border-radius:8px}
input,textarea{width:100%;padding:10px 13px;border:1.5px solid var(--line);border-radius:10px;font-size:.9rem;outline:none;margin-bottom:10px;background:#fffdf9;transition:.2s}
input:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 4px rgba(180,83,9,.1);background:#fff}
label{font-size:.84rem;color:#6b5a42;display:block;margin-bottom:5px;font-weight:500}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:.85rem;margin-top:8px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid #f5eee4}
th{background:#fdf6ec;color:#6b4f2c;font-weight:600;font-size:.82rem}
tr:last-child td{border-bottom:none}
tbody tr{transition:.15s}
tbody tr:hover{background:#fdf9f3}
.tag{display:inline-block;padding:3px 11px;border-radius:999px;font-size:.74rem;font-weight:500}
.tag.blue{background:#e0f2fe;color:#0369a1}.tag.green{background:#dcfce7;color:#15803d}
.tag.orange{background:#ffedd5;color:#c2410c}.tag.red{background:#fee2e2;color:#b91c1c}.tag.gray{background:#f1f5f9;color:#64748b}
.filters{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.filters button{padding:7px 18px;border:1.5px solid var(--brand);background:#fff;color:var(--brand);border-radius:999px;cursor:pointer;font-size:.85rem;transition:.22s;font-weight:500}
.filters button:hover{background:var(--brand-light)}
.filters button.active{background:var(--brand);color:#fff;box-shadow:0 4px 10px rgba(180,83,9,.25)}
.empty{text-align:center;color:#c2b49e;padding:36px 0;font-size:.88rem}
.empty::before{content:"💊";display:block;font-size:2rem;margin-bottom:8px;opacity:.6}
.muted{color:var(--muted);font-size:.8rem}
footer{text-align:center;color:#c2b49e;font-size:.78rem;padding:30px 0}
</style>
</head>
<body>
<div class="topbar">
  <div><b>💊 智慧医疗就诊系统 · 药房</b></div>
  <div id="staffArea" style="font-size:.85rem"></div>
</div>

<div class="main">
  <div class="card">
    <h3>📥 处方接收 <span class="muted">（实时接收医生提交的电子处方，按状态筛选）</span></h3>
    <div class="filters">
      <button class="active" data-s="">全部</button>
      <button data-s="待发药">待发药</button>
      <button data-s="待缴费">待缴费</button>
      <button data-s="已完成">已完成</button>
      <button data-s="已作废">已作废</button>
    </div>
    <div id="rxList"></div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <h3>🔍 处方核对</h3>
    <div id="rxDetail"></div>
    <label>完成备注</label>
    <input id="remark" placeholder="如：已发药，患者已取走 / 部分完成 / 缺药待补" value="已发药，患者已取走">
    <button class="btn green" onclick="dispense()">确认发药并备注完成</button>
  </div>
</div>
<footer>智慧医疗就诊系统 · 药房 | 处方接收核对 · 配药发药 · 完成状态备注</footer>

<script>
//统一登录：令牌与身份按角色分槽存（token_患者 / token_药房 ...），四个端互不覆盖
const MY_ROLE = 'pharmacy';
let token = localStorage.getItem('token_' + MY_ROLE) || '';
let staff = token ? JSON.parse(localStorage.getItem('user_' + MY_ROLE) || 'null') : null;

function clearAuth() {
  localStorage.removeItem('token_' + MY_ROLE);
  localStorage.removeItem('user_' + MY_ROLE);
  ['token', 'user', 'role', 'patient', 'doctor', 'doctor_token', 'staff'].forEach(k => localStorage.removeItem(k));
}
async function logoutStaff() {
  try { await api('/api/auth/logout', { method: 'POST' }); } catch (e) {}
  clearAuth();
  location.href = '/login.html?role=pharmacy';
}

let currentRx = null;
let currentStatus = '';

//所有请求统一带上 X-Token，令牌失效集中跳登录页
async function api(url, opts) {
  opts = opts || {};
  const headers = Object.assign({}, opts.headers || {});
  if (token) headers['X-Token'] = token;
  let r;
  try {
    const res = await fetch(url, Object.assign({}, opts, { headers }));
    r = await res.json();
  } catch (e) {
    return { code: -1, msg: '网络异常：' + e.message };
  }
  if (r && r.code === 401) {
    alert('登录状态已失效，请重新登录');
    clearAuth();
    location.href = '/login.html?role=pharmacy';
    throw new Error('401');
  }
  return r;
}
//后端返回的是 ISO(UTC) 时间，统一转成本地时间显示（直接截字符串会差8小时甚至差一天）
function fmtTime(d) {
  if (!d) return '';
  const t = new Date(d);
  if (isNaN(t.getTime())) return String(d);
  const p = n => String(n).padStart(2, '0');
  return `${t.getFullYear()}-${p(t.getMonth() + 1)}-${p(t.getDate())} ${p(t.getHours())}:${p(t.getMinutes())}`;
}

document.querySelector('.filters').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('.filters button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentStatus = btn.dataset.s;
  loadList();
});

async function loadList() {
  const r = await api('/api/pharmacy/rx/list' + (currentStatus ? '?status=' + encodeURIComponent(currentStatus) : ''));
  const box = document.getElementById('rxList');
  if (!r.data || r.data.length === 0) { box.innerHTML = '<div class="empty">暂无处方</div>'; return; }
  const color = { '待缴费': 'orange', '待发药': 'blue', '已完成': 'green', '已作废': 'gray' };
  box.innerHTML = '<table><tr><th>处方编号</th><th>就诊人</th><th>开方医生</th><th>诊断</th><th>金额</th><th>状态</th><th>开方时间</th><th>操作</th></tr>' +
    r.data.map(p => `<tr><td>${p.rxNo}</td><td>${p.visitorName}</td><td>${p.doctorName}</td>
      <td>${(p.diagnosis || '').substring(0, 14)}</td><td>￥${p.totalAmount}</td>
      <td><span class="tag ${color[p.status]}">${p.status}</span></td><td>${fmtTime(p.createTime)}</td>
      <td><button class="btn sm blue" onclick="showDetail(${p.id})">核对/详情</button></td></tr>`).join('') + '</table>';
}

async function showDetail(id) {
  currentRx = id;
  const r = await api('/api/pharmacy/rx/detail?id=' + id);
  if (r.code !== 200) { alert(r.msg); return; }
  const p = r.data;
  document.getElementById('detailCard').style.display = 'block';
  document.getElementById('rxDetail').innerHTML = `
    <table>
      <tr><th>处方编号</th><td>${p.rxNo}</td><th>状态</th><td><span class="tag blue">${p.status}</span></td></tr>
      <tr><th>就诊人</th><td>${p.visitorName}</td><th>开方医生</th><td>${p.doctorName}</td></tr>
      <tr><th>诊断</th><td colspan="3">${p.diagnosis}</td></tr>
      <tr><th>缴费状态</th><td colspan="3">${p.status === '待缴费' ? '<span class="tag orange">未缴费（暂缓发药）</span>' : '<span class="tag green">已缴费</span>'}</td></tr>
    </table>
    <h3 style="margin-top:12px">药品明细（核对名称、规格、数量、用法用量）</h3>
    <table><tr><th>药品</th><th>规格</th><th>数量</th><th>用法用量</th><th>疗程</th><th>小计</th></tr>
      ${(p.items || []).map(i => `<tr><td>${i.medicineName}</td><td>${i.spec}</td><td>${i.quantity}</td>
        <td>${i.dosage || ''} ${i.frequency || ''}</td><td>${i.course || ''}</td><td>￥${i.subtotal}</td></tr>`).join('')}
    </table>
    <p class="muted" style="margin-top:8px">合计金额：￥${p.totalAmount} ${p.remark ? '｜ 备注：' + p.remark : ''}</p>`;
  document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth' });
}

async function dispense() {
  const remark = document.getElementById('remark').value.trim() || '已完成发药';
  const r = await api(`/api/pharmacy/rx/dispense?rxId=${currentRx}&remark=${encodeURIComponent(remark)}`, { method: 'POST' });
  alert(r.msg);
  if (r.code === 200) {
    document.getElementById('detailCard').style.display = 'none';
    loadList();
  }
}

//未登录（无身份或无令牌）直接跳登录页；已登录才初始化，避免拿 null 取属性报错
if (staff && token) {
  document.getElementById('staffArea').innerHTML =
    `💊 当前登录：${staff.name}（${staff.account}） <a href="javascript:logoutStaff()" style="color:#fff;margin-left:8px">退出登录</a>`;
  loadList();
} else {
  location.href = '/login.html?role=pharmacy';
}
</script>
</body>
</html>
